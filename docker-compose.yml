x-app: &app
  build: .
  image: relayq:local
  environment: &env
    DATABASE_URL: postgresql://relayq:relayq@postgres:5432/relayq
    REDIS_URL: redis://redis:6379
    SMTP_URL: smtp://mailhog:1025
    MAIL_FROM: relayq@localhost
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-dev-secret}
    ADMIN_USER: ${ADMIN_USER:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    PULSEBOARD_URL: ${PULSEBOARD_URL:-http://host.docker.internal:4000}
    PULSEBOARD_TOKEN: ${PULSEBOARD_TOKEN:-}
    EXPORT_BUCKET: ${EXPORT_BUCKET:-relayq-exports}
    TENANT_JOBS_PER_MIN: ${TENANT_JOBS_PER_MIN:-100}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
    PORT: "3200" # app listens on 3200 inside the container too (3000 kept free)
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }

services:
  migrate:
    image: relayq:local
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: *env
    depends_on:
      postgres: { condition: service_healthy }

  # --import ./dist/otel.js starts OpenTelemetry before the app loads (traces → Jaeger UI on :16686).
  api:
    <<: *app
    command: ["node", "--import", "./dist/otel.js", "dist/api/server.js"]
    environment: { <<: *env, OTEL_SERVICE_NAME: relayq-api }
    ports: ["3200:3200"]

  worker:
    <<: *app
    command: ["node", "--import", "./dist/otel.js", "dist/worker/index.js"]
    environment: { <<: *env, OTEL_SERVICE_NAME: relayq-worker }
    deploy: { replicas: 3 }
    stop_grace_period: 35s # worker drains for up to 30s on SIGTERM

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"] # BullMQ requirement
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 15 }

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: relayq, POSTGRES_PASSWORD: relayq, POSTGRES_DB: relayq }
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "relayq"], interval: 2s, retries: 15 }

  jaeger:
    image: jaegertracing/all-in-one:1.62.0 # OTLP/HTTP on 4318, UI on 16686
    ports: ["16686:16686"]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["8025:8025"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment: { GF_SERVER_HTTP_PORT: "3001", GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer }
    volumes:
      - ./ops/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana-dashboard.json:/var/lib/grafana/dashboards/relayq.json:ro
    ports: ["3001:3001"]

  # Load test (Phase 6): docker compose --profile load run --rm k6
  sink:
    image: hashicorp/http-echo:1.0
    command: ["-text=ok", "-listen=:5678"]
    profiles: [load]

  k6:
    image: grafana/k6:0.54.0
    command: ["run", "--summary-export=/load/summary.json", "/load/enqueue.k6.js"]
    environment:
      RELAYQ_URL: http://api:3200
      RELAYQ_KEY: ${RELAYQ_KEY:-}
      SINK_URL: http://sink:5678/
      DURATION: ${DURATION:-5m}
    volumes: ["./load:/load"]
    depends_on: [api, sink]
    profiles: [load]

  # Chaos suite (Phase 7): npm run chaos
  chaos-sink:
    image: node:20-alpine
    command: ["node", "/chaos/sink.mjs"]
    volumes: ["./chaos:/chaos:ro"]
    ports: ["5679:5679"]
    profiles: [chaos]

volumes:
  pgdata:
